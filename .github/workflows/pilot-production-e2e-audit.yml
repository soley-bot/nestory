name: Pilot production E2E audit

on:
  push:
    branches:
      - codex/pilot-production-e2e-audit
    paths:
      - scripts/pilot-production-e2e-audit-v2.mjs
      - .github/workflows/pilot-production-e2e-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NESTORY_BASE_URL: https://pilot.nestory-kh.com
      NESTORY_TEST_EMAIL: 143jester@gmail.com
      AUDIT_ARTIFACT_DIR: artifacts/pilot-production-e2e-audit-v2

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run read-only Pilot audit
        id: audit
        shell: bash
        run: |
          set +e
          node scripts/pilot-production-e2e-audit-v2.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-production-e2e-audit-v2
          path: artifacts/pilot-production-e2e-audit-v2
          if-no-files-found: error
          retention-days: 7

      - name: Report audit failures
        if: steps.audit.outputs.status != '0'
        run: exit 1
