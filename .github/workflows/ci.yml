name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  statuses: write

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test unit tier
        run: npm run test:unit

      - name: Test UI tier
        run: npm run test:ui

      - name: Test contract tier
        run: npm run test:contracts

      - name: Build
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify forward-only migrations
        run: npm run db:verify-migrations

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reset database
        run: npm run db:reset

      - name: Lint database
        run: npm run db:lint

      - name: Verify generated database types
        run: |
          npm run db:types
          git diff --exit-code -- src/types/database.generated.ts

      - name: Load database test baseline
        run: npm run db:test:fixture

      - name: Test database
        run: npm run test:database

      - name: Test lease-term authority concurrency
        run: npm run leases:test-term-authority

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

  application_gate:
    name: Report Application deployment gate
    needs: application
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report Application deployment gate
        uses: actions/github-script@v9
        with:
          script: |
            const state = "${{ needs.application.result }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "Vercel - nestory: Application",
              description: `Application CI ${state === "success" ? "passed" : "failed"}`,
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            });

  production_database:
    name: Production Database
    needs: database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-database
    concurrency:
      group: production-supabase
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out exact merged main SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact merged main SHA
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Verify production database credentials are configured
        shell: bash
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"

      - name: Link exact production project
        run: npm exec -- supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify hosted migration preflight
        run: npm run db:hosted-preflight

      - name: Dry-run production migrations
        run: npm exec -- supabase db push --linked --dry-run

      - name: Apply production migrations
        run: npm exec -- supabase db push --linked

      - name: Verify hosted migration postflight
        run: npm run db:hosted-postflight

      - name: Lint linked database
        run: npm exec -- supabase db lint --linked --level error --fail-on error

      - name: Confirm no pending production migrations
        run: npm exec -- supabase db push --linked --dry-run

  production_database_gate:
    name: Report Database deployment gate
    needs: production_database
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report Database deployment gate
        uses: actions/github-script@v9
        with:
          script: |
            const state = "${{ needs.production_database.result }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "Vercel - nestory: Database",
              description: `Hosted database release ${state === "success" ? "passed" : "failed"}`,
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            });
