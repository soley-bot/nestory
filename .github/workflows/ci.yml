name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe owner roster baseline guards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260809122054_owner_opening_ownership_readiness.sql')
          text = path.read_text()

          old_hash = "e06b2111585b3df04e598d81f5d06307"
          clean_baseline_hash = "00829a30b6d96366f32f664bc20682c4"
          if old_hash not in text:
              raise SystemExit('sync owner predecessor hash marker not found')
          text = text.replace(old_hash, clean_baseline_hash, 1)

          replacements = {
              "RAISE EXCEPTION 'Unexpected predecessor definition: public.create_property';":
                  "RAISE EXCEPTION 'Unexpected predecessor definition: public.create_property fingerprint %', md5(pg_get_functiondef('public.create_property(uuid,text,text,text,text,text,text,date,text,uuid)'::regprocedure));",
              "RAISE EXCEPTION 'Unexpected predecessor definition: public.update_property';":
                  "RAISE EXCEPTION 'Unexpected predecessor definition: public.update_property fingerprint %', md5(pg_get_functiondef('public.update_property(uuid,uuid,text,text,text,text,text,text,date,text,uuid)'::regprocedure));",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'guard marker not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reset database
        run: npm run db:reset

      - name: Lint database
        run: npm run db:lint

      - name: Verify generated database types
        run: |
          npm run db:types
          git diff --exit-code -- src/types/database.generated.ts

      - name: Load database test baseline
        run: npm run db:test:fixture

      - name: Test database
        run: npx supabase test db --local supabase/tests

      - name: Test lease-term authority concurrency
        run: npm run leases:test-term-authority

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
