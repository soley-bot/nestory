name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expose owner roster predecessor fingerprint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260809122054_owner_opening_ownership_readiness.sql')
          text = path.read_text()
          old = "RAISE EXCEPTION 'Unexpected predecessor definition: app_private.sync_property_primary_owner(uuid,uuid,uuid)';"
          new = "RAISE EXCEPTION 'Unexpected predecessor definition: app_private.sync_property_primary_owner(uuid,uuid,uuid) fingerprint %', md5(pg_get_functiondef('app_private.sync_property_primary_owner(uuid,uuid,uuid)'::regprocedure));"
          if old not in text:
              raise SystemExit('owner roster predecessor guard marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reset database
        run: npm run db:reset

      - name: Lint database
        run: npm run db:lint

      - name: Verify generated database types
        run: |
          npm run db:types
          git diff --exit-code -- src/types/database.generated.ts

      - name: Load database test baseline
        run: npm run db:test:fixture

      - name: Test database
        run: npx supabase test db --local supabase/tests

      - name: Test lease-term authority concurrency
        run: npm run leases:test-term-authority

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
