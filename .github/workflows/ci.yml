name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  secret_scan:
    name: Repository secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Scan tracked repository secrets
        run: npm run security:secrets

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit dependency vulnerabilities
        run: npm run security:audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit -- --reporter=default --reporter=junit --outputFile=ci-reports/unit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-reports-${{ github.run_attempt }}
          path: ci-reports/unit.xml
          retention-days: 7
          if-no-files-found: warn

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: UI tests
        run: npm run test:ui -- --reporter=default --reporter=junit --outputFile=ci-reports/ui.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-reports-${{ github.run_attempt }}
          path: ci-reports/ui.xml
          retention-days: 7
          if-no-files-found: warn

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Contract tests
        run: npm run test:contracts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test built PR preview locally
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/preview-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/login || true)"
            if [ "$status" = "200" ]; then
              printf 'Built preview login route returned HTTP 200.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            kill -0 "$server_pid"
            sleep 2
          done
          exit 1

  application:
    name: Application
    needs: [secret_scan, dependency_audit, lint, types, unit, ui, contracts, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every application check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" | jq -e 'length == 8 and all(.[]; .result == "success")'

  release_readiness:
    name: Release readiness
    needs: [application, database]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require application and database checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" | jq -e 'length == 2 and all(.[]; .result == "success")'

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify forward-only migrations
        run: npm run db:verify-migrations

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Reset database
        run: npm run db:reset

      - name: Lint database
        run: npm run db:lint

      # Supabase CLI 2.108.0 hard-codes public ECR for this image during
      # local type generation. Pre-seed the identical official GHCR
      # image while supabase/cli#5785 is unresolved.
      - name: Seed pinned postgres-meta image for type generation
        shell: bash
        run: |
          set -euo pipefail
          readonly source_digest="sha256:2559d20aaa50f2eb86a6cb2e5af4e847e87139673bc214b4655c126d96c160b2"
          readonly source_image="ghcr.io/supabase/postgres-meta@${source_digest}"
          readonly target_image="public.ecr.aws/supabase/postgres-meta:v0.96.1"

          for attempt in 1 2 3; do
            if docker pull "${source_image}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

          test "$(docker image inspect "${source_image}" --format '{{.Os}}')" = "linux"
          test "$(docker image inspect "${source_image}" --format '{{.Architecture}}')" = "amd64"
          readonly source_id="$(docker image inspect "${source_image}" --format '{{.Id}}')"
          docker tag "${source_image}" "${target_image}"
          test "$(docker image inspect "${target_image}" --format '{{.Id}}')" = "${source_id}"

      - name: Verify generated database types
        run: |
          npm run db:types
          git diff --exit-code -- src/types/database.generated.ts

      - name: Load database test baseline
        run: npm run db:test:fixture

      - name: Test database
        run: npm run test:database

      - name: Test photo and logo Storage concurrency
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-concurrency=1 scripts/photo-logo-storage-concurrency.node-test.mjs

      - name: Test maintenance reminder lifecycle concurrency
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-concurrency=1 scripts/maintenance-reminder-concurrency.node-test.mjs

      - name: Test lease-term authority concurrency
        run: npm run leases:test-term-authority

      - name: Test paid-cost transaction concurrency
        run: npm run paid-cost:test-concurrency

      - name: Test legacy deposit default concurrency
        run: npm run leases:test-deposit-default

      - name: Test deposit lifecycle and idempotency concurrency
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test --test-concurrency=1 scripts/lease-deposit-lifecycle-concurrency.node-test.mjs

      - name: Test historical rent correction concurrency
        run: npm run rent:test-correction-concurrency

      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

  application_gate:
    name: Report Application deployment gate
    needs: application
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write

    steps:
      - name: Report Application deployment gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const state = "${{ needs.application.result }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "Vercel - nestory: Application",
              description: `Application CI ${state === "success" ? "passed" : "failed"}`,
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            });

  production_database:
    name: Production Database
    needs: database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: production-database
    concurrency:
      group: production-supabase
      cancel-in-progress: false

    steps:
      - name: Check out exact merged main SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify exact merged main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$MAIN_SHA" = "$GITHUB_SHA"

      - name: Verify production database credentials are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PROJECT_ID:-}"

      - name: Link exact production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: npm exec -- supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify hosted migration preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:hosted-preflight

      - name: Capture Pilot preservation preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly snapshot_path="$RUNNER_TEMP/pilot-preservation-before.json"
          readonly query="$(cat scripts/pilot-preservation-snapshot.sql)"
          readonly output="$(npm exec -- supabase --agent yes --output-format json db query --linked "$query")"
          jq -ceS '.rows | select(length == 1)' <<<"$output" > "$snapshot_path"
          test -s "$snapshot_path"

      - name: Normalize approved hosted function newlines
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly state_output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/classify-hosted-function-newline-recovery.sql)"
          readonly recovery_state="$(jq -er '.rows | select(length == 1) | .[0].recovery_state | select(. == "required" or . == "complete")' <<<"$state_output")"
          case "$recovery_state" in
            required)
              npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/normalize-hosted-function-newlines.sql
              readonly output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/verify-hosted-function-newline-recovery.sql)"
              jq -ce '.rows | select(length == 1) | .[0].recovery_descriptor | select(.hosted_ledger_count == 103 and .hosted_ledger_head == "20260822045638" and .target_count == 21 and .normalization == "CRLF to LF only")' <<<"$output"
              ;;
            complete)
              printf 'Approved hosted function newline recovery already complete.\n'
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Capture approved financial evidence recovery preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly state_path="$RUNNER_TEMP/financial-evidence-recovery-state.txt"
          readonly before_path="$RUNNER_TEMP/financial-evidence-preservation-before.json"
          readonly state_output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/classify-hosted-financial-evidence-branch-backfill.sql)"
          readonly recovery_state="$(jq -er '.rows | select(length == 1) | .[0].recovery_state | select(. == "required" or . == "restore_required" or . == "resume" or . == "restore_resume" or . == "complete")' <<<"$state_output")"
          printf '%s\n' "$recovery_state" | tee "$state_path"

          case "$recovery_state" in
            required|restore_required|resume|restore_resume)
              readonly snapshot_output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/financial-evidence-preservation-snapshot.sql)"
              jq -ceS '.rows | select(length == 1)' <<<"$snapshot_output" > "$before_path"
              test -s "$before_path"
              ;;
            complete)
              printf 'Approved financial evidence recovery already complete.\n'
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Dry-run production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm exec -- supabase db push --linked --dry-run --yes

      - name: Apply approved financial evidence recovery and production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly state_path="$RUNNER_TEMP/financial-evidence-recovery-state.txt"
          test -s "$state_path"
          readonly expected_state="$(cat "$state_path")"

          classify_recovery() {
            local output
            output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/classify-hosted-financial-evidence-branch-backfill.sql)"
            jq -er '.rows | select(length == 1) | .[0].recovery_state' <<<"$output"
          }

          restore_guard() {
            npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/restore-hosted-financial-evidence-guard.sql
          }

          prepare_guard() {
            npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/prepare-hosted-financial-evidence-branch-backfill.sql
          }

          readonly current_state="$(classify_recovery)"
          test "$current_state" = "$expected_state"

          case "$current_state" in
            required)
              trap restore_guard EXIT
              prepare_guard
              npm exec -- supabase db push --linked --yes
              restore_guard
              trap - EXIT
              ;;
            restore_required)
              trap restore_guard EXIT
              restore_guard
              prepare_guard
              npm exec -- supabase db push --linked --yes
              restore_guard
              trap - EXIT
              ;;
            resume)
              npm exec -- supabase db push --linked --yes
              ;;
            restore_resume)
              restore_guard
              npm exec -- supabase db push --linked --yes
              ;;
            complete)
              npm exec -- supabase db push --linked --yes
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Verify approved financial evidence recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly before_path="$RUNNER_TEMP/financial-evidence-preservation-before.json"
          if test -s "$before_path"; then
            readonly after_path="$RUNNER_TEMP/financial-evidence-preservation-after.json"
            readonly verification_output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/verify-hosted-financial-evidence-branch-backfill.sql)"
            jq -ce '.rows | select(length == 1) | .[0].financial_evidence_recovery_descriptor | select(.hosted_ledger_count == 107 and .hosted_ledger_head == "20260822091214" and .target_count == 3 and .strict_guard_restored == true)' <<<"$verification_output"
            readonly snapshot_output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/financial-evidence-preservation-snapshot.sql)"
            jq -ceS '.rows | select(length == 1)' <<<"$snapshot_output" > "$after_path"
            test -s "$after_path"
            diff --unified=0 "$before_path" "$after_path"
          else
            readonly state_output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/classify-hosted-financial-evidence-branch-backfill.sql)"
            jq -ce '.rows | select(length == 1) | .[0].recovery_state | select(. == "complete")' <<<"$state_output"
          fi

      - name: Verify hosted migration postflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm run db:hosted-postflight

      - name: Verify Pilot preservation postflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly before_path="$RUNNER_TEMP/pilot-preservation-before.json"
          readonly after_path="$RUNNER_TEMP/pilot-preservation-after.json"
          readonly query="$(cat scripts/pilot-preservation-snapshot.sql)"
          readonly output="$(npm exec -- supabase --agent yes --output-format json db query --linked "$query")"
          test -s "$before_path"
          jq -ceS '.rows | select(length == 1)' <<<"$output" > "$after_path"
          test -s "$after_path"
          diff --unified=0 "$before_path" "$after_path"

      - name: Verify Pilot Chart of Accounts postflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          readonly output="$(npm exec -- supabase --agent yes --output-format json db query --linked --file scripts/verify-pilot-chart-of-accounts-postflight.sql)"
          jq -ce '.rows | select(length == 1) | .[0].pilot_chart_of_accounts_postflight' <<<"$output"

      - name: Lint linked database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm exec -- supabase db lint --linked --level error --fail-on error

      - name: Confirm no pending production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npm exec -- supabase db push --linked --dry-run --yes

  production_database_gate:
    name: Report Database deployment gate
    needs: production_database
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write

    steps:
      - name: Report Database deployment gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const state = "${{ needs.production_database.result }}" === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "Vercel - nestory: Database",
              description: `Hosted database release ${state === "success" ? "passed" : "failed"}`,
              target_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            });
