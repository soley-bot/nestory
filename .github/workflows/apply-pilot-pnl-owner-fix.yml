name: Apply Pilot P&L owner fix

on:
  push:
    branches:
      - codex/pilot-finance-audit-fixes
    paths:
      - scripts/apply-pilot-pnl-owner-fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/pilot-finance-audit-fixes
          fetch-depth: 0
      - name: Apply P&L owner identity fix
        run: python scripts/apply-pilot-pnl-owner-fix.py
      - name: Commit fix
        run: |
          git config user.name "soley-bot"
          git config user.email "143jester@gmail.com"
          git add src/features/reports/data/trusted-report.ts src/features/reports/data/report-scope-guard.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "Load owner identity into Unit P&L exports"
          git push origin HEAD:codex/pilot-finance-audit-fixes
